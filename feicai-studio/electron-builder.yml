appId: com.feicai.studio
productName: FEICAI Studio
copyright: Copyright © 2024 FEICAI

directories:
  output: dist
  buildResources: resources
afterSign: scripts/notarize.mjs

files:
  - package.json
  - node_modules/**/*
  - out/**/*
  - resources/builtin-skills/**/*
  - "!**/*.map"

extraResources:
  - from: resources/builtin-skills
    to: builtin-skills
    filter:
      - "**/*"

mac:
  icon: resources/release-assets/generated/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  darkModeSupport: true
  hardenedRuntime: true
  
dmg:
  icon: resources/release-assets/generated/icon.icns
  artifactName: "${productName}-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/release-assets/generated
  target:
    - AppImage
  category: AudioVideo
