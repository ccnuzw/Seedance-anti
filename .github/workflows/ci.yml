name: CI

on:
  push:
    paths:
      - 'feicai-studio/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'feicai-studio/**'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: feicai-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feicai-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
